<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cryptography - JobExamJK</title>
<script>
/* Apply saved/preferred theme before first paint to avoid a flash. */
(function(){
  try{
    var t = localStorage.getItem("jobexam:theme");
    if(t !== "light" && t !== "dark"){
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="wrap">
  <p class="crumbs"><a href="../index.html">Home</a> &nbsp;/&nbsp; <a href="../subject-list.html">Subject List</a> &nbsp;/&nbsp; <span id="subjectTitle">Subject</span></p>

  <!-- ============ SUBJECT HOME (overview + exam list) ============ -->
  <div id="subjectHome">
    <div class="page-head">
      <p class="page-eyebrow">Subject</p>
      <h1 class="page-title">Cryptography</h1>
      <p class="page-desc">Cryptosystem basics, steganography, cryptanalysis, symmetric &amp; asymmetric encryption, hashing, digital certificates, and cryptographic protocols.</p>
    </div>

    <div class="stat-strip">
      <div class="stat-cell"><div class="stat-num" id="statTotalQ">0</div><div class="stat-label">Total Questions</div></div>
      <div class="stat-cell"><div class="stat-num" id="statTotalExams">0</div><div class="stat-label">Total Exams</div></div>
      <div class="stat-cell"><div class="stat-num" id="statCompleted">0/0</div><div class="stat-label">Exams Completed</div></div>
    </div>

    <div class="grid" id="examList"></div>
  </div>

  <div id="site-examview"></div>

  <div id="site-footer"></div>
</div>

<!-- NOTE: no data/*.js is loaded eagerly here. Questions are fetched
     from ../data/cryptography.json only AFTER the access password
     succeeds - see js/auth.js + js/subject-list.js. auth.js must load
     before common.js since common.js's registry click-handler calls
     requireAccess(). -->
<script src="../js/auth.js"></script>
<script src="../js/common.js"></script>
<script src="../js/subject-list.js"></script>
<script src="../js/layout.js"></script>
<script src="../js/theme.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => initSubjectPage("cryptography"));
</script>
</body>
</html>
