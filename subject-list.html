<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Subject Registry - JobExamJK</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("jobexam:theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="site-header"></div>

    <div class="wrap">
      <p class="crumbs">
        <a href="index.html">Home</a> &nbsp;/&nbsp; <span>Subject List</span>
      </p>

      <div class="page-head">
        <p class="page-eyebrow">Subject Registry</p>
        <h1 class="page-title">Choose a subject to begin practice</h1>
        <p class="page-desc">
          Every exam has exactly 50 fixed questions, answered in order or
          freely, with instant explanations after each answer - just like
          sitting for the real thing.
        </p>
      </div>

      <div class="grid" id="subjectGrid"></div>

      <div id="site-footer"></div>
    </div>

    <!-- NO MORE data/<subject>.js script tags here at all.
         Counts come from SUBJECTS[].questionCount in common.js;
         actual questions are fetched per-subject after unlock. -->
    <script src="js/auth.js"></script>
    <script src="js/common.js"></script>
    <script src="js/layout.js"></script>
    <script src="js/theme.js"></script>
  </body>
</html>
