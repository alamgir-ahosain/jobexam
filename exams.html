<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subject Registry — JobExam</title>
<script>
/* Apply saved/preferred theme before first paint to avoid a flash. */
(function(){
  try{
    var t = localStorage.getItem("jobexam:theme");
    if(t !== "light" && t !== "dark"){
      t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", t);
  }catch(e){}
})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="wrap">
  <p class="crumbs"><a href="index.html">Home</a> &nbsp;/&nbsp; <span>Exams</span></p>

  <div class="page-head">
    <p class="page-eyebrow">Subject Registry</p>
    <h1 class="page-title">Choose a subject to begin practice</h1>
    <p class="page-desc">Every exam has exactly 50 fixed questions, answered in order or freely, with instant explanations after each answer — just like sitting for the real thing.</p>
  </div>

  <div class="grid" id="subjectGrid"></div>

  <div id="site-footer"></div>
</div>

</html>
